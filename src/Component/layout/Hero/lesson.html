<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Helo world</h1>
    <h2>Helo world</h2>
    <h3>Helo world</h3>
    <h4>Helo world</h4>
    <h5>Helo world</h5>
    <h6>Helo world</h6>

    <p>Helo world <br> my name is .....</p> <!--<br> одиночный тег  для того чтобьы переместитьбь строку вниз-->

    <i>hello</i> <!--<i></i> делает шрифт курсивным-->
    <hr>
    <b>hello</b> <!--делает шрифт жирным-->

    <mark>hello</mark> <!--маркированый-->

    <u>hello</u> <!--нижнее подчеркивание-->

    <ul> <!--Список точками-->
        <hr>
        <li>fruits
            <ol> <!--список внутри списка-->
                <li>apple</li>
                <li>grape</li>
                <li>reach</li>
            </ol>
        </li>
        <hr> <!--horizontal rule-->
        <li>vegetables</li>
        <li>car
            <ul>
                <li>bmw</li>
                <li>mercedes</li>
                <li>audi</li>
            </ul>
        </li>
    </ul>

    <ol> <!--список цифрами-->
        <li>fruits</li>
        <li>vegetables</li>
        <li>car</li>
    </ol>

    <a href="">it-run</a> <!--Ссылка-->

    <a href="https://itrun.tj/"><button type="button">push</button></a>
    <!--кнрпка внутри ссылки при нажатии идет на сайт или файл-->
    <input type="text"> <!--инпут это тег который принимает какую нибудь информацию-->
    <input type="number"> <!--принимает цифры-->
    <input type="password"> <!--нужен для пароли при введении пароли вместо ппароли пояляется точки-->
    <input type="email"> <!--для email-->

        alt="" width="100px" height="100px">
